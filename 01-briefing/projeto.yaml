faq:
  - pergunta: "Onde encontrar uma agropecuária em Estância Velha?"
    resposta: "A Agropecuária Estância Animal está localizada na Avenida Walter Klein, 865, bairro Bela Vista, em Estância Velha - RS. A loja oferece rações, produtos agropecuários, pet shop, ferragens e jardinagem, além de atendimento veterinário e banho e tosa, reunindo produtos e serviços em um único lugar."

  - pergunta: "Como escolher a melhor ração para cães e gatos?"
    resposta: "A escolha da ração depende da idade, porte, fase de vida e necessidades nutricionais do animal. Rações premium e super premium apresentam diferenças na composição e digestibilidade. Na Estância Animal, você encontra opções de alimentação para cães e gatos e pode consultar os produtos disponíveis."

  - pergunta: "Com que frequência devo levar meu cachorro para banho e tosa?"
    resposta: "A frequência depende da raça, tipo de pelagem, rotina e condições de saúde do cachorro. Muitos cães podem tomar banho a cada duas a quatro semanas, mas o intervalo ideal varia conforme as necessidades individuais. A Estância Animal oferece banho e tosa em Estância Velha, mediante disponibilidade e agendamento."

  - pergunta: "Quando devo levar meu cachorro ou gato ao veterinário?"
    resposta: "Cães e gatos precisam de acompanhamento veterinário periódico para prevenção de doenças e avaliação da saúde. Alterações no comportamento, falta de apetite e sintomas persistentes também merecem atenção profissional. A Estância Animal disponibiliza atendimento veterinário em Estância Velha mediante agendamento."

  - pergunta: "Como identificar pulgas e carrapatos em cães e gatos?"
    resposta: "Coceira frequente, irritações na pele, vermelhidão e presença de parasitas na pelagem podem indicar pulgas ou carrapatos. A prevenção e o tratamento devem utilizar produtos adequados à espécie, idade e peso do animal, seguindo orientação veterinária."

  - pergunta: "Quais produtos são necessários para cuidar de um jardim?"
    resposta: "Os principais produtos incluem substratos, adubos, mudas, ferramentas de poda, regadores e materiais para manutenção de plantas. A escolha depende do tipo de planta, iluminação e condições do solo. A Estância Animal trabalha com produtos de jardinagem em Estância Velha."

  - pergunta: "Quais são os principais cuidados com animais de criação?"
    resposta: "Animais de criação precisam de alimentação adequada, água limpa, higiene, instalações apropriadas e acompanhamento sanitário. Rações específicas, comedouros, bebedouros e produtos agropecuários auxiliam no manejo e no bem-estar dos animais."
